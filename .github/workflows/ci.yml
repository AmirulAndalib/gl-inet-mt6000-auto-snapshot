name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['release_history.json']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox dash

      - name: Lint Python
        run: |
          ruff check scripts tests
          ruff format --check scripts tests

      - name: Lint shell
        run: shellcheck -s sh gl_autoupdate.sh tests/test_gl_autoupdate.sh

      - name: Python tests
        run: python -m pytest -q

      # The router runs BusyBox ash, so test there as well as with dash.
      - name: Router script tests (busybox ash)
        run: SHELL_UNDER_TEST="busybox ash" sh tests/test_gl_autoupdate.sh

      - name: Router script tests (dash)
        run: SHELL_UNDER_TEST=dash sh tests/test_gl_autoupdate.sh
