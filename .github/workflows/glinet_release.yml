name: GL.iNet MT6000 Firmware Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the release plan without creating anything'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

# Two runs creating releases at once race on tag names. Queue them instead.
concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run release processor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: mt6000
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/process_releases.py

      # Runs even when the processor reports a failure, so releases created
      # earlier in the same run are still recorded in the history file.
      - name: Commit release history
        if: ${{ !cancelled() && !inputs.dry_run }}
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: 'chore: update release history'
          file_pattern: release_history.json
          commit_options: '--no-verify'
